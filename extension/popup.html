<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torelium Stealth Core</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: #0d0f14;
    color: #e2e8f0;
    width: 320px;
    min-height: 200px;
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #1a1f2e 0%, #0f1219 100%);
    border-bottom: 1px solid rgba(99, 102, 241, 0.2);
    padding: 14px 16px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo {
    width: 28px; height: 28px;
    background: url('icon128.png') no-repeat center center;
    background-size: contain;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .header-text h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #f1f5f9;
  }

  .header-text span {
    font-size: 10px;
    color: #64748b;
    font-weight: 400;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: rgba(15, 23, 42, 0.6);
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px #22c55e;
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }
  .status-dot.red { background: #ef4444; box-shadow: 0 0 6px #ef4444; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  .status-bar span {
    font-size: 11px;
    color: #94a3b8;
  }

  /* Info grid */
  .info-grid {
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: space-between;
  }

  .info-label {
    font-size: 10.5px;
    color: #64748b;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .info-value {
    font-size: 11px;
    font-family: 'Consolas', 'Courier New', monospace;
    color: #cbd5e1;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .info-value.loading { color: #475569; font-style: italic; font-family: system-ui; font-size: 10.5px; }
  .info-value.good    { color: #86efac; }
  .info-value.bad     { color: #fca5a5; }

  .flag { font-size: 14px; }

  .count-badge {
    background: rgba(99,102,241,0.15);
    color: #a5b4fc;
    border: 1px solid rgba(99,102,241,0.2);
    border-radius: 5px;
    padding: 1px 7px;
    font-size: 10.5px;
    font-weight: 600;
    font-family: 'Consolas', 'Courier New', monospace;
  }

  /* Content */
  .content { padding: 12px 16px; }

  .btn {
    width: 100%;
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
    letter-spacing: 0.2px;
  }

  .btn-primary {
    background: linear-gradient(135deg, #6366f1, #7c3aed);
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) {
    background: linear-gradient(135deg, #818cf8, #8b5cf6);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
  }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: rgba(255,255,255,0.05);
    color: #94a3b8;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .btn-secondary:hover {
    background: rgba(255,255,255,0.09);
    color: #cbd5e1;
    border-color: rgba(99,102,241,0.3);
  }

  .message {
    font-size: 11px;
    text-align: center;
    padding: 7px 10px;
    border-radius: 7px;
    margin-bottom: 8px;
    display: none;
    line-height: 1.4;
  }
  .message.success { background: rgba(34,197,94,0.1); color: #86efac; border: 1px solid rgba(34,197,94,0.2); display: block; }
  .message.error   { background: rgba(239,68,68,0.1); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); display: block; }

  .cooldown { font-size: 10px; color: #475569; text-align: center; height: 14px; margin-bottom: 4px; }

  .divider { height: 1px; background: rgba(255,255,255,0.05); margin: 8px 0; }
</style>
</head>
<body>

<div class="header">
  <div class="logo"></div>
  <div class="header-text">
    <h1>Torelium Stealth Core</h1>
    <span>v7.6 · CreepJS-Proof</span>
  </div>
</div>

<div class="status-bar">
  <div class="status-dot" id="torDot"></div>
  <span id="torStatus">Tor durumu kontrol ediliyor...</span>
</div>

<div class="info-grid">
  <div class="info-row">
    <span class="info-label">🌍 Çıkış IP</span>
    <span class="info-value loading" id="exitIP">yükleniyor…</span>
  </div>
  <div class="info-row">
    <span class="info-label">🕵️ CreepJS ID</span>
    <span class="info-value loading" id="exitFPID">yükleniyor…</span>
  </div>
  <div class="info-row">
    <span class="info-label">🔄 Bu Oturumda</span>
    <span class="count-badge" id="newnymCount">0 kimlik değişimi</span>
  </div>
</div>

<div class="content">
  <div class="message" id="message"></div>
  <div class="cooldown" id="cooldown"></div>

  <button class="btn btn-primary" id="btnNewnym">
    <span>⚡</span> Yeni Tor Kimliği Al
  </button>

  <div class="divider"></div>

  <button class="btn btn-secondary" id="btnChecklist">
    🛡️ Gizlilik Kontrol Paneli
  </button>
</div>

<script src="popup.js"></script>
</body>
</html>
